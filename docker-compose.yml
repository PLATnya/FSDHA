services:
  mysql:
    image: mysql:8.0
    container_name: fsdha_mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fsdha_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fsdha_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fsdha_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fsdha_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fsdha_network

volumes:
  mysql_data:
    driver: local
  uploaded_files:
    driver: local

networks:
  fsdha_network:
    driver: bridge
